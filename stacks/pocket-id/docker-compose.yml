services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.18.0
    container_name: pocket-id
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_DIR}/pocket-id:/app/data
      - ./encryption_key:/run/secrets/encryption_key:ro
    networks:
      - zoraxy_default
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
networks:
  zoraxy_default:
    external: true
