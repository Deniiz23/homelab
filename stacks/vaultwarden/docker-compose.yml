services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.${DOMAIN}"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - ${DATA_DIR}/vaultwarden:/data
    networks:
      - zoraxy_default
networks:
  zoraxy_default:
    external: true
