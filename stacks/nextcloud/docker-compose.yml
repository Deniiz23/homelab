services:
  nextcloud:
    image: nextcloud:33
    container_name: nextcloud
    mem_limit: 1750m
    extra_hosts:
      - "cloud.${DOMAIN}:${HOST_IP}"
    restart: always
    ports:
      - 8080:80
      - 7443:443
    volumes:
      - ${DATA_DIR}/nextcloud:/var/www/html
      - ${DATA_DIR}/apache-conf/zz-nextcloud-tuning.conf:/etc/apache2/conf-enabled/zz-nextcloud-tuning.conf:ro
    environment:
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_HOST=mariadb
      - NEXTCLOUD_ADMIN_USER=admin
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PHP_MEMORY_LIMIT=512M
    depends_on:
      - mariadb
      - redis

  mariadb:
    image: mariadb:11.4
    container_name: mariadb
    mem_limit: 512m
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
    volumes:
      - ${DATA_DIR}/mariadb:/var/lib/mysql
      - ${DATA_DIR}/mariadb/custom.cnf:/etc/mysql/conf.d/custom.cnf

  redis:
    image: redis:8-alpine
    container_name: redis
    mem_limit: 320m
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ${DATA_DIR}/redis/data:/data
    restart: unless-stopped